:root{--ios:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.22,1,.36,1)}

.screen.app-open .home,.screen.app-open .dock{transform:scale(.93);opacity:.55}

.app .icon,.dock .icon{transition:transform .38s var(--spring),filter .2s}

.btn,.file-tile,.photo-thumb,.appfooter button{transition:transform .25s var(--spring),opacity .2s}
.btn:active,.file-tile:active,.photo-thumb:active{transform:scale(.97)}
.appfooter button:active{opacity:.55}
.iosrow,.mailitem{transition:background-color .25s ease}

function finalPDF(){return `<p class="verdict no-print">✓ اكتمل التحقيق — عرفتِ ما ائتمنتك عليه ليان.</p><article class="pdf-sheet"><div class="docbrand">نسخة محفوظة / الحقيقة.pdf</div><h2>إلى سارة</h2><p>سارة، أنا بخير. تركت الهاتف لأن ناصر، أخي، طلب مني حذف صورة عقد زواجه. تزوّج ريم دون علم أهلنا، والعقد هو الإثبات الوحيد لحقها، فلم أستطع أن أحذفه.</p><p>وضعت الأصل في خزانة 47 وأبقيت الصورة هنا حتى لا يضيع شيء. الرصيف والتذكير ورسائلك كانت طريقتي للاحتفاظ بالطريق إليك.</p><p>— ليان</p><div class="pdf-page-number">١ / ٣</div></article><article class="pdf-sheet"><div class="docbrand">ما تحتويه الأمانة</div><h2>ما الذي كنتِ تحرسينه</h2><p>الأمانة هي النسخة الأصلية من عقد زواج ناصر، وصورة منها في هذا الهاتف.</p><table><thead><tr><th>البيان</th><th>الحالة</th><th>من يعلم</th></tr></thead><tbody><tr><td>العقد</td><td>موثّق رسميًا</td><td>ناصر وزوجته والشاهدان</td></tr><tr><td>النسخة الأصلية</td><td>في خزانة 47</td><td>ليان وسارة (دون معرفة السبب)</td></tr><tr><td>صورة العقد</td><td>في هذا الهاتف</td><td>طلب ناصر حذفها</td></tr><tr><td>الأهل</td><td>لا علم لهم</td><td>—</td></tr></tbody></table><p>لم يتغير شيء في العقد؛ الذي تغيّر أن صاحبه أراد أن يُمحى أثره.</p><div class="pdf-page-number">٢ / ٣</div></article><article class="pdf-sheet"><div class="docbrand">مراسلة محفوظة / مرفقة بالنسخة الأصلية</div><h2>طلب الحذف</h2><p><b>من:</b> رقم غير مسجّل<br><b>إلى:</b> ليان<br><b>الموضوع:</b> صورة العقد</p><blockquote style="margin:20px 0;padding:12px;background:#f1f4f6">احذفي صورة العقد من الهاتف، ولا ترسليها إلى سارة أو إلى أي أحد. أرجوكِ.</blockquote><p>للتواصل: <span dir="ltr">+966 5•• ••• 019</span></p><p><b>ملاحظة ليان:</b> هذا الرقم هو رقم أخي ناصر الثاني، وهو الذي أرسل التحذير. هو لا يهددني؛ هو خائف فقط.</p><div class="note-divider"></div><p>تركت لك الطريق، لا القرار. الآن تعرفين لماذا لم أحذف شيئًا.</p><div class="pdf-page-number">٣ / ٣</div></article>${endings[state.ending]?`<div class="card no-print"><h3>${endings[state.ending][0]}</h3><p>${endings[state.ending][1]}</p></div>`:`<div class="no-print"><p class="sectionlabel">ما قرارك؟</p><button class="btn" onclick="chooseEnding('keep')">أحتفظ بالسر</button><button class="btn secondary" onclick="chooseEnding('nasser')">أخبر ناصر أني عرفت</button><button class="btn secondary" onclick="chooseEnding('family')">أخبر الأهل</button></div>`}<button class="btn secondary no-print" onclick="window.print()">طباعة الملف أو حفظه PDF</button>`}

const hintTexts=['في الملاحظات توجد رسالة مثبتة لسارة. ماذا تعني «ارجعي إلى بداياته»؟','اقرئي أول حرف من الأسطر الأربعة. الناتج اسم مكان؛ ابحثي عن صورته في المكتبة.','عنوان الصورة «الرصيف». كبّريها: رقم الخزانة هو المكان، والورقة تشير إلى الأمانة وموعدها.','في التذكيرات، افتحي الأمانة المطابقة للخزانة. اختاري الموعد المعتمد، ثم ابحثي عن رسالة سارة في الدقيقة نفسها.','رسالة سارة في واتساب تصف قسمًا فوق الدور الثاني مباشرة. احتفظي برقم الدور بخانتين، وراجعي ترتيب الجملة في الملاحظة.','الحل الكامل: المكان 47، اللحظة 1925، الارتفاع 03. كلمة المرور 47192503.'];
function settingsHTML(){if(detail==='hints')return title('تلميحات التحقيق')+'<p class="ioscaption">كل تلميح يكشف خطوة أكثر. التلميح السادس يعرض كلمة المرور كاملة.</p>'+hintTexts.slice(0,state.hints).map((h,i)=>'<div class="hint"><b>تلميح '+(i+1)+'</b><br>'+h+'</div>').join('')+(state.hints<6?'<button class="btn secondary" onclick="revealHint()">'+(state.hints===5?'كشف الحل الكامل':'إظهار التلميح التالي')+'</button>':'');if(detail==='reset')return title('لعبة جديدة')+'<div class="card"><p>سيُحذف تقدم هذا السيناريو ودفتر التحقيق والمفضلة من هذا المتصفح.</p><button class="btn danger" onclick="resetGame()">بدء من جديد</button><button class="btn secondary" onclick="openDetail(null)">إلغاء</button></div>';return title('الإعدادات')+'<div class="iosgroup"><div class="iosrow"><span class="settings-avatar">ل</span><span class="rowtext"><b>ليان</b><small>هاتف شخصي · آخر إشارة — الأمانة</small></span></div></div><div class="iosgroup">'+row('الوضع الصامت','مفعّل',"toast('الهاتف على الوضع الصامت')")+row('قفل الشاشة','',"lockPhone()")+'</div><div class="sectionlabel">التحقيق</div><div class="iosgroup">'+row('عن القصة','أنتِ سارة، والهاتف الذي أمامك هاتف ليان.',"openDetail('story')")+row('تلميحات اختيارية','تُكشف تدريجيًا عند الطلب',"openDetail('hints')")+row('بدء لعبة جديدة','',"openDetail('reset')")+'</div>'+(detail==='story'?'<div class="card"><p>وجدتِ هاتف ليان على طاولة المقهى. افتحي التطبيقات واربطِي ما تركته، للوصول إلى ملف الحقيقة. كل ما تحتاجينه موجود داخل الهاتف.</p><p>الصور والملاحظات والمحادثات هنا جزء من تجربة خيالية.</p></div>':'')}
function revealHint(){state.hints=Math.min(6,state.hints+1);save();render()}
function resetGame(){state={memo:'',won:false,hints:0,done:[],favorites:[]};save();lockPhone()}
function searchApps(q){$('searchResults').innerHTML=apps.filter(a=>a[0]!=='search'&&a[1].includes(q.trim())).map(a=>row(a[1],'',`openApp('${a[0]}')`,a[2])).join('')||'<p class="ioscaption">لا توجد نتائج</p>'}
let swipeStart=null,swipeX=0,swipeDelta=0;

$('lock').addEventListener('pointermove',e=>{if(swipeStart===null)return;swipeDelta=Math.min(0,e.clientY-swipeStart);if(Math.abs(e.clientX-swipeX)>100)return;$('lock').style.transition='none';$('lock').style.transform='translateY('+swipeDelta+'px)'});
function finishSwipe(){if(swipeStart===null)return;swipeStart=null;$('lock').style.transition='';if(swipeDelta < -65)start();else $('lock').style.transform=''}
$('lock').addEventListener('pointerup',finishSwipe);$('lock').addEventListener('pointercancel',()=>{swipeStart=null;$('lock').style.transition='';$('lock').style.transform='' });
let galleryTouch=null;
$('content').addEventListener('touchstart',e=>{galleryTouch=current==='photos'&&galleryIndex!==null&&!galleryZoom&&e.touches.length===1&&e.target.closest('.photo-stage')?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
$('content').addEventListener('touchend',e=>{if(!galleryTouch||e.touches.length){galleryTouch=null;return}const dx=e.changedTouches[0].clientX-galleryTouch.x,dy=e.changedTouches[0].clientY-galleryTouch.y;galleryTouch=null;if(Math.abs(dx)>65&&Math.abs(dy)<50)moveGallery(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(current==='photos'&&galleryIndex!==null){if(e.key==='ArrowLeft')moveGallery(1);if(e.key==='ArrowRight')moveGallery(-1)}if(e.key==='Escape')backApp()});

<script id="ios-motion-js">
(()=>{
const el=id=>document.getElementById(id),screen=el('screen'),av=el('appview'),content=el('content'),lock=el('lock'),
      home=document.querySelector('.home'),dock=el('dock'),toastEl=el('toast'),EASE='cubic-bezier(.32,.72,0,1)',
      calm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;

/* انزلاق صفحة التفاصيل (الاتجاه RTL: التقدّم من اليسار والرجوع من اليمين) */
const slide=(dir,fn)=>{fn();if(calm())return;content.getAnimations().forEach(a=>a.cancel());
  content.animate([{transform:`translateX(${dir*28}%)`,opacity:0},{transform:'translateX(0)',opacity:1}],{duration:380,easing:EASE})};

/* نقطة انطلاق الفتح = مركز الأيقونة المضغوطة */
let tapRect=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.home .app,#dock button');
  tapRect=b?(b.querySelector('.icon')||b).getBoundingClientRect():null},true);
const setOrigin=()=>{const s=screen.getBoundingClientRect();
  if(tapRect){av.style.setProperty('--ox',tapRect.left+tapRect.width/2-s.left-av.offsetLeft+'px');
              av.style.setProperty('--oy',tapRect.top+tapRect.height/2-s.top-av.offsetTop+'px')}
  else{av.style.setProperty('--ox','50%');av.style.setProperty('--oy','55%')}tapRect=null};

const _open=window.openApp;
window.openApp=function(){const was=av.classList.contains('active');if(!was)setOrigin();
  _open.apply(this,arguments);
  if(was&&!calm())content.animate([{opacity:0},{opacity:1}],{duration:220,easing:'ease-out'})};

const _detail=window.openDetail;
window.openDetail=function(id){const dir=id===null?(detail!==null?1:0):-1;
  dir?slide(dir,()=>_detail.call(this,id)):_detail.call(this,id)};

const _back=window.backApp;
window.backApp=function(){(detail!==null||galleryIndex!==null)?slide(1,()=>_back.call(this)):_back.call(this)};

/* toast */
let tt;const _toast=window.toast;
window.toast=function(){_toast.apply(this,arguments);toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2600)};

/* إتاحة الوصول: لا تركيز داخل ما هو مخفي */
new MutationObserver(()=>{av.inert=!av.classList.contains('active')}).observe(av,{attributes:true,attributeFilter:['class']});
av.inert=true;
const homeInert=v=>{home.inert=v;dock.inert=v};
const _start=window.start;window.start=function(){_start.apply(this,arguments);homeInert(false);screen.style.removeProperty('--p');screen.classList.remove('dragging')};
const _lock=window.lockPhone;window.lockPhone=function(){_lock.apply(this,arguments);homeInert(true)};
homeInert(true);

/* سحب القفل: الشاشة الرئيسية تظهر تدريجيًا + دعم الفلك السريع (سرعة) */
let y0=null,lastY=0,lastT=0,vel=0,dy=0;
lock.addEventListener('pointerdown',e=>{if(e.target.closest('.quick'))return;y0=lastY=e.clientY;lastT=performance.now();vel=0;dy=0},true);
lock.addEventListener('pointermove',e=>{if(y0===null)return;const n=performance.now();
  vel=(e.clientY-lastY)/Math.max(1,n-lastT);lastY=e.clientY;lastT=n;dy=Math.min(0,e.clientY-y0);
  const p=Math.min(1,-dy/320);screen.classList.add('dragging');screen.style.setProperty('--p',p);lock.style.opacity=String(1-p*.6)});
const endLock=()=>{if(y0===null)return;const fast=vel<-.5&&dy<-12;y0=null;screen.classList.remove('dragging');screen.style.removeProperty('--p');
  if(!screen.classList.contains('locked'))return;lock.style.opacity='';if(fast)window.start()};
lock.addEventListener('pointerup',endLock);lock.addEventListener('pointercancel',endLock);

/* السحب للأعلى من شريط الهوم للخروج من التطبيق */
const hb=document.querySelector('.homebar');let hy=null,hd=0,moved=false;
hb.addEventListener('pointerdown',e=>{hy=e.clientY;hd=0;moved=false;hb.setPointerCapture(e.pointerId)});
hb.addEventListener('pointermove',e=>{if(hy===null||!av.classList.contains('active'))return;hd=Math.min(0,e.clientY-hy);
  if(hd<-6){moved=true;const p=Math.min(1,-hd/260);av.style.transition='none';
    av.style.transform=`translateY(${hd*.35}px) scale(${1-p*.12})`;av.style.borderRadius=p*40+'px'}});
const endHb=()=>{if(hy===null)return;const d=hd;hy=null;hd=0;av.style.transition='';av.style.transform='';av.style.borderRadius='';if(d<-60)window.goHome()};
hb.addEventListener('pointerup',endHb);hb.addEventListener('pointercancel',endHb);
hb.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();moved=false}},true);
})();
</script>
